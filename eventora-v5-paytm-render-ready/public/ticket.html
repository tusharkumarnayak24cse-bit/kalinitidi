<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventora Ticket</title><link rel="stylesheet" href="/style.css"></head><body class="ticket-page"><div id="box" class="ticket"><p>Loading ticket...</p></div><script>
const id=new URLSearchParams(location.search).get("id");fetch("/api/tickets/"+encodeURIComponent(id||"")).then(async r=>({ok:r.ok,d:await r.json()})).then(({ok,d})=>{const b=document.getElementById("box");if(!ok){b.innerHTML=`<p>${d.error||"Ticket not found"}</p>`;return}b.innerHTML=`<div><p class="eyebrow dark">Eventora Ticket</p><h2>${d.id}</h2><p><b>${d.guest_name}</b><br>${d.pass_type} × ${d.quantity}<br>Amount: ₹${d.amount}</p><p>${d.checked_in?"Checked in ✅":"Valid for entry"}</p></div><img src="${d.qr_data_url}" alt="QR ticket">`});</script></body></html>
