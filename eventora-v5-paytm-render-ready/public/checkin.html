<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventora QR Check-in</title><link rel="stylesheet" href="/style.css"></head><body class="admin-page">
<header><a class="logo" href="/">EVENT<span>ORA</span></a><nav><a href="/admin.html">Admin</a><a href="/">Website</a></nav></header>
<section class="section admin-shell scanner-wrap"><p class="eyebrow dark">Gate Operations</p><h1 class="admin-title">Scan QR Ticket</h1><div class="note">Open this page on your phone, allow camera access, and scan the guest’s Eventora QR code. You must be logged in to the admin dashboard first.</div><div id="reader" class="reader"></div><div class="card scanner-card"><label>Or enter Ticket ID manually<input id="ticketId" placeholder="EVT-XXXXXXXX"></label><button id="checkBtn" class="btn full">Check In Guest</button><p id="msg" class="message"></p></div><div id="result" class="result hidden"></div></section>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script>
const token=localStorage.getItem("eventoraAdminToken")||"";let busy=false;
async function checkIn(ticketId){if(!ticketId||busy)return;busy=true;const r=await fetch("/api/admin/checkin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({ticketId})});const d=await r.json();const m=document.getElementById("msg"),box=document.getElementById("result");if(!r.ok){m.className="message bad";m.textContent=d.error||"Check-in failed";box.classList.add("hidden");busy=false;return}m.className="message ok";m.textContent="Guest checked in successfully.";box.innerHTML=`<strong>${d.booking.guest_name}</strong><br>${d.booking.pass_type} × ${d.booking.quantity}<br>${d.booking.id}`;box.classList.remove("hidden");setTimeout(()=>busy=false,1800)}
document.getElementById("checkBtn").onclick=()=>checkIn(document.getElementById("ticketId").value.trim());
function onScanSuccess(decoded){try{const data=JSON.parse(decoded);if(data.ticket)checkIn(data.ticket)}catch{if(decoded.startsWith("EVT-"))checkIn(decoded)}}
if(window.Html5QrcodeScanner){new Html5QrcodeScanner("reader",{fps:10,qrbox:{width:250,height:250}},false).render(onScanSuccess,()=>{})}
</script></body></html>
