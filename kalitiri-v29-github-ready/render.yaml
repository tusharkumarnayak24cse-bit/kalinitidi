services:
  - type: web
    name: kaali-ni-tidi-v17
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURN_TIMEOUT_MS
        value: 60000
      - key: BOT_ACTION_DELAY_MS
        value: 1400
      - key: TRICK_REVIEW_MS
        value: 3800
      - key: RECONNECT_GRACE_MS
        value: 90000

# Optional production settings for v15:
# TURN_TIMEOUT_MS=60000
# RECONNECT_GRACE_MS=90000
# PERSISTENCE_FILE=/var/data/kalitiri-state.json   # use a Render persistent disk
# TURN_URL=turn:your-turn-server.example.com:3478
# TURN_USERNAME=...
# TURN_CREDENTIAL=...

      - key: ACCOUNTS_FILE
        value: /var/data/kalitiri-accounts.json

      - key: ADMIN_KEY
        value: change-me-in-render

      - key: REGION_ID
        value: singapore

      - key: SPECTATOR_DELAY_MS
        value: 5000
