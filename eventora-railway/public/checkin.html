<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventora Check-in</title><link rel="stylesheet" href="/style.css"></head><body class="admin-page">
<header><a class="logo" href="/">EVENT<span>ORA</span></a><nav><a href="/admin.html">Admin</a><a href="/">Website</a></nav></header>
<section class="section admin-shell"><p class="eyebrow dark">Gate Operations</p><h1 class="admin-title">Ticket Check-in</h1><div class="note">Enter the ticket ID printed below the QR code. This page requires an active admin login from the dashboard.</div><div class="card checkin-box"><label>Ticket ID<input id="ticketId" placeholder="EVT-XXXXXXXX"></label><button id="checkBtn" class="btn full">Check In Guest</button><p id="msg" class="message"></p></div><div id="result" class="check-result hidden"></div></section><script>
const token=localStorage.getItem("eventoraAdminToken")||"";document.getElementById("checkBtn").onclick=async()=>{const id=document.getElementById("ticketId").value.trim();const r=await fetch("/api/admin/checkin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({ticketId:id})});const d=await r.json();const m=document.getElementById("msg"),box=document.getElementById("result");if(!r.ok){m.className="message bad";m.textContent=d.error||"Check-in failed";box.classList.add("hidden");return}m.className="message ok";m.textContent="Guest checked in successfully.";box.innerHTML=`<strong>${d.booking.guest_name}</strong><br>${d.booking.pass_type} × ${d.booking.quantity}<br>${d.booking.id}`;box.classList.remove("hidden")};
</script></body></html>
